 investiture_controversy_struggle:0 "Investiture Controversy"
 investiture_controversy_struggle_desc:0 "A defining conflict of medieval Europe, the Investiture Controversy centers on the struggle between secular rulers and the Church over who holds the  authority to appoint bishops and grant them temporal and spiritual power. This clash reshaped the balance of power across Christendom, leaving a legacy of enduring tension between the throne and  the altar."
 investiture_controversy_phase_unrest:0 "Unrest"
 investiture_controversy_phase_unrest_desc:0 "Amid growing discord, the foundations of authority are challenged as competing factions within the Church and secular realms jockey for influence,  setting the stage for greater confrontation."
 investiture_controversy_phase_hostility:0 "Hostility"
 investiture_controversy_phase_hostility_desc:0 "Violence and open defiance mark this phase as secular rulers and the Church clash over control, with battles fought both on the battlefield and in  the court of public opinion."
 investiture_controversy_phase_conciliation:0 "Conciliation"
 investiture_controversy_phase_conciliation_desc:0 "As the costs of prolonged conflict weigh heavily, efforts to restore stability lead to negotiations and tentative cooperation, seeking to  preserve both temporal and spiritual realms."
 investiture_controversy_ending_phase_compromise:0 "Compromise"
 investiture_controversy_ending_phase_compromise_desc:0 "A delicate settlement is achieved, defining new boundaries between ecclesiastical authority and secular power while leaving lingering  questions unresolved."
 
 tct_investiture_controversy_change_allegiance: "Join My Side"
 tct_investiture_controversy_change_allegiance.desc.actor_is_supporter: "Convince [recipient.GetShortUIName] to become a [GetTrait('tct_imperial_supporter').GetName( GetNullCharacter )]"
 tct_investiture_controversy_change_allegiance.desc.actor_is_detractor: "Convince [recipient.GetShortUIName] to become a [GetTrait('tct_papal_supporter').GetName( GetNullCharacter )]"
 tct_investiture_controversy_change_allegiance.desc.fallback: "Convince [recipient.GetShortUIName] to join your ranks"
 tct_investiture_controversy_change_allegiance_extra_icon: "$arrange_marriage_interaction_extra_icon$"

 tct_investiture_controversy_change_allegiance.tt.recently_voluntarily_became_supporter: "[recipient.GetShortUIName] recently announced [recipient.GetHerHis] public support for the [GetTitleByKey('e_hre').GetHolder.GetTitleAsNameNoTooltip]"
