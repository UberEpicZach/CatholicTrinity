 tct_investiture_controversy_change_allegiance.tt.recently_forced_to_detractor: "[recipient.GetShortUIName] was recently forced to become a [GetTrait('tct_papal_supporter').GetName( GetNullCharacter )] by the actions of [GetTitleByKey('e_hre').GetHolder.GetTitleAsNameNoTooltip]"
