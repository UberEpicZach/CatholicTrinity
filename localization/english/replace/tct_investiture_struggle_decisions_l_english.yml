 #EVENT LOC
 tct_neutral_struggle.0002.t: "Goslar, Silver Mines and the Saxons"
 tct_neutral_struggle.0002.desc: "I stand within the Imperial Palace of Goslar looking out to the fields below...the Saxons—a thorn in the flesh, a thorn that dates back to the reign of my late father. Goslar, this palace which is supposed to signify unity, has instead become a chokehold upon their livelihoods. It's a bitter draught to swallow, but who am I to deny the burdens of lineage? \n\nYet, I stand resolute in my intentions. The silver mines of Rammelsberg, the fortresses that rise like dragons along the Harz mountains—these are not mere whims of a tyrant. They are bastions of imperial strength, my strength as emperor, My ministeriales, their Swabian roots notwithstanding, are the sinew and bone of this vision. If the Saxons see this as a threat, it is only because they are blinded by their own insecurities. They'll soon come to understand, either willingly or through the firm hand of my governance."
 tct_neutral_struggle.0002.a: "All in good time.."

 tct_neutral_struggle.0003.t: "Goslar, Silver Mines and the Salians"
 tct_neutral_struggle.0003.desc: "Dark are the days since Henry IV ascended the throne, casting his shadow over Saxon lands like a hawk circling its prey. My heart beats with indignation as I hear of the Emperor's deeds, his Rhenish Franconian heritage betraying no love for us. Goslar, that accursed palace, has not only consumed our wealth but has become a symbol of subjugation. I can feel the resentment simmering among my countrymen, a cauldron set to boil over. \n\nIn the heart of the Harz mountains, he plunders our silver and erects fortresses as if adorning his realm with trophies of conquest. The Harzburg castle and its ilk serve as reminders of his authority. But the true insult lies in the Swabian ministeriales he has unleashed upon us, men who raid our villages and tarnish our honor. Henry might see this as an assertion of royal power, but we see it for what it is—an invasion, a threat to our existence. This unrest finds echoes even among the Empire's great princes. If Henry believes that castles and ministeriales can quash the Saxon spirit, he is gravely mistaken. The time for passive support is dwindling; the moment for action draws near."
 tct_neutral_struggle.0003.a: "All in good time.."


 tct_neutral_struggle.0004.t: "Ravensburg, Disinheritance and Rising Rebellion"
 tct_neutral_struggle.0004.desc: "[spouse.GetFirstName]’s family, the Dukes of Bavaria, stand firm against [emperor.GetTitledFirstName]'s ambition, but I am left with little more than Ravensburg. My father, [father.GetFullName], favors my half-brother, leaving me to wonder where my future lies. The [spouse.GetDynastyName]’ potential rebellion is tempting, but aligning with the Emperor may secure my position. Or perhaps I could look back towards Lombardy, where my blood still ties me, offering another path." 
 tct_neutral_struggle.0004.a: "We should not be so hasty."
 tct_neutral_struggle.0004.a.tt: "The future is uncertain and may present you different opportunities."

 # Saxon Rebellion Chain

# "Accusations of Treason" (1070). # Event for Otto of Bavaria and Heinrich IV 
# Egeno of Konradsburg accuses Otto of Bavaria for Treason. Calls for a Trial
 tct_neutral_struggle.0005.t: "Accusations of Treason"
 tct_neutral_struggle.0005.desc.a: "I find myself holding a sealed letter inked with [emperor.GetTitledFirstName]'s crest. The demand is clear: I am to present myself in [province.GetNameNoTier] to answer for certain 'crimes' against the crown.\n\n#italic ‘I, [Egeno.GetFullName], stand before you with a dire truth: I have uncovered a vile conspiracy against our sovereign, [emperor.GetTitledFirstName]. The [saxons.GetName] counts alongside [otto.GetFirstName] [otto.GetDynastyName], [otto.GetTitleAsNameNoTooltip] of [otto.GetPrimaryTitle.GetNameNoTier], have plotted in secret to overthrow the crown. But it goes further—[otto.GetFirstName] himself gave me the order to murder the king! This treachery runs deep, and I have borne witness to their twisted designs.' #! \n\nConspiracy... #italic Murder...#! My name now tied to treason...\nNo doubt the entire realm has seen these accusations by now; all eyes are me."
 tct_neutral_struggle.0005.desc.b: "The court buzzes with low murmurs as Egeno strides forward, his head held high and eyes locked on mine. He kneels briefly, then rises to speak, commanding the attention of all present. \n\n#italic "I, [Egeno.GetFullName], bring dire news before Your Imperial Majesty. Treason festers within your realm! The [saxons.GetName] counts, with [otto.GetFirstName] [otto.GetDynastyName], [otto.GetTitleAsNameNoTooltip] of [otto.GetPrimaryTitle.GetNameNoTier], at their head, have conspired to overthrow your divine rule. And worse—[otto.GetFirstName] himself commanded me to murder you, my liege!" #! \n\nGasps ripple through the hall, but I watch as eyes dart not to Egeno, but to me. His performance is flawless, as we had agreed. The court believes this to be his moment of bravery, but the path ahead was charted long before he spoke. \n\n"These are grave accusations," I declare, my voice steady. "Let [otto.GetFirstName] [otto.GetDynastyName] stand trial and answer for them before God and the Empire.""
 tct_neutral_struggle.0005.a: "I must defend myself.."
 tct_neutral_struggle.0005.a.tt: "You will travel to [province.GetNameNoTier]"
 tct_neutral_struggle.0005.ab: "All according to plan"
 tct_neutral_struggle.0005.b.tt: "[otto.GetFirstName] [otto.GetDynastyName] will recieve a letter and travel to [province.GetNameNoTier] to stand trial"
 
 
# "The Court's Judgment" # Event for Otto of Bavaria and Heinrich IV 
# Attempt to plea your case, or break off as an adventurer. (If Deposed you become an adventurer anyways)
 tct_neutral_struggle.0006.t: "The Court's Judgment"
 tct_neutral_struggle.0006.desc: "As I ride through the city streets, the weight of countless eyes is upon me—nobles whisper behind closed doors, and commoners watch with wary curiosity. [emperor.GetTitledFirstName], perched on his seat of power, is not seeking justice today. His aim is clear: to eliminate a threat, one of the few [saxons.GetName]'s' who might stand against him.\n\nStill, I ride on. For the sake of my house, I must face what lies ahead. To flee now would only confirm every whisper, every accusation. But to stand my ground and face trial... perhaps there is still a chance, however slim, to turn this judgment to my advantage...My name is called, and the trial begins."
 tct_neutral_struggle.0006.a: "I will face the court."
 tct_neutral_struggle.0006.a.success: "Your speech convinces the jury of your innocence"
 tct_neutral_struggle.0006.a.failure: "Your speech fails to convince anyone"
 tct_neutral_struggle.0006.b: "I must #italic flee#!"
 
# New Opportunities # Event for Welf IV
# Offer from Emperor, for Welf to Divorce Wife / Split from Nordheim's, In exchange, get the Duchy of Bavaria
 tct_neutral_struggle.0007.t: "New Opportunities"
 tct_neutral_struggle.0007.desc: "The Imperial Chancellor has arrived unexpectedly, bearing a message from [emperor.GetTitledFirstName] himself. He begins, relaying the emperor's offer with exact and careful words. "[otto.GetFirstName] [otto.GetDynastyName], the [otto.GetTitleAsName] of [otto.GetPrimaryTitle.GetNameNoTier], your father-in-Law, currently stands trial in [province.GetNameNoTier]..." \n\nThough the chancellor's tone, it is clear the trial is merely a formality. Otto's fate has already been sealed—the emperor intends to remove him from power. \n\nThe chancellor leans closer, his voice lowering. "[emperor.GetTitledFirstName] offers you a great opportunity. Swear your loyalty to him, divorce your Nordheim wife, and sever all ties with her family. In exchange, the Duchy of Bavaria will be yours." The offer is straightforward: break from Otto's house, and the duchy will pass to my hands, but to turn my back on Otto and Ethelinde... I must decide quickly..."
 tct_neutral_struggle.0007.a: "I will accept the offer."
 tct_neutral_struggle.0007.b: "I must refuse..."

# "Allies in the Shadows" # Event for Otto of Bavaria and Magnus Billung
# Otto Forging war plans with Magnus Billung
 tct_neutral_struggle.0008.t: "Allies in the Shadows"
 #tct_neutral_struggle.0008.opening: "To Otto, once Duke of Bavaria and still a man of honor despite the crown’s betrayal"
 tct_neutral_struggle.0008.desc: "#italic ‘To [otto.GetFirstName], once Duke of Bavaria and still a man of honor despite the crown’s betrayal, I have long considered the injustices done to you, a man who gave loyalty only to have it spat back in his face. Know that you are not forgotten—least of all by me. \n\nThe emperor’s trial may have silenced you within the Empire, but here in Saxony, we speak of your fall as proof of his tyranny. Men may rise with words, but only steel will bring the emperor to his knees. My people murmur of rebellion, and I can no longer stand idle while [emperor.GetFirstName] wields a powerful cudgel against the Saxons. \n\nYou'd be restored to your rightful station, as I would see my family avenged for their suffering. I have the means to fund a band of loyal warriors for you. In return, I ask for your sword and name to join with mine when the moment comes. Together, we will burn away the rot and reclaim what is owed.’#!"
 tct_neutral_struggle.0008.a: "I will join you in this struggle."
 tct_neutral_struggle.0008.a.tt: "@warning_icon! #X You will join the #high Civil War#! against [emperor.GetShortUIName], on the side of the Saxons led by [magnus.GetShortUIName] in a few months#!" 
 tct_neutral_struggle.0008.b: "My time in the imperial court is over."
 tct_neutral_struggle.0008.b.tt: "You will remain an adventurer"

# "The Saxon Revolt" # Event for Otto of Bavaria and Heinrich IV, maybe everyone in the struggle region?
 FIRST_SAXON_REVOLT_WAR_NAME: "The Saxon Uprising"
 tct_neutral_struggle.0009.t: "The Saxon Uprising"
 tct_neutral_struggle.0009.desc: "The Saxons have risen in defiance, their long-simmering anger now bursting into open rebellion. \n\nThe emperor’s trial of [otto.GetFirstName] [otto.GetDynastyName] has been the catalyst, igniting years of frustration into a full-scale revolt. Led by [magnus.GetFullName], the Saxon lords have united under a single banner, and the people, emboldened, have taken up arms to throw off the weight of imperial oppression. Rebel forces now march toward Goslar, their resolve clear: to bring the emperor to account for his tyranny."
 tct_neutral_struggle.0009.a: "Let the best one win."
 tct_neutral_struggle.0009.b: "Let the best one win." 
 every_saxon_vassal: "Every vassal of your [culture.GetNameNoTooltip]" 

 every_tct_faith_vassal: "Every [GetFaithByKey('catholic').GetAdjective] Vassal"

# "The Sack of Harzburg" # Event for Otto of Bavaria and Heinrich IV

 tct_neutral_struggle.0010.t: "The Sack of Goslar-Harzburg"
 tct_neutral_struggle.0010.desc: "The once-proud Palace of Harzburg lies in ruin, its sacred grounds desecrated. A group of [magnus.GetFirstName]'s Rebel forces, have turned to unrestrained barbarism. Graves have been ripped open, the remains of princes and bishops discarded like refuse, their sanctity mocked by jeering looters. The chapel, once a place of reverence, is now rubble, its relics stolen or destroyed, and its altars smeared with blood and ash. \n\nThe monks who tried to shield the graves lie among the ruins, their lifeless bodies scattered where they made their final stand. Some rebels laugh at the carnage, their cruelty unchecked, while others falter, horror etched into their faces as the scale of their comrades' savagery became clear. \n\nThis is no longer rebellion—it is sacrilege. Whispers of unease spread through the empire itself: ‘This was not justice.’ This has not broken the emperor’s resolve but strengthened his claim to vengeance, what was once a rebellion for justice is now condemned as a campaign of heresy and barbarism."
 tct_neutral_struggle.0010.a: ""This... this is unthinkable."

# The Second Rebellion # Event for Otto of Bavaria and Heinrich IV
























 tct_investiture_struggle.0051.t: "The Investiture Controversy"
 tct_investiture_struggle.0051.desc: "A new power struggle arrises, that threatens to rend Christendom asunder. The Holy Roman Emperor and the Pope stand opposed as the rights of [investiture|E] become the battleground for supremacy while Noble houses see both peril and promise...\n"

 tct_investiture_struggle.0051.desc.emperor: "\nI will not be undone by the ambitions of a church that seeks to claim what is rightfully mine. The princes grumble and the bishops conspire, hoping to see me falter, but I am no mere custodian of titles — I am the chosen of God, ordained to rule by divine right. The power to shape the fate of Christendom is not theirs to take. It is mine to wield!"

 tct_investiture_struggle.0051.desc.pope: "\nThe lords whisper of rebellion, the emperor seeks to wrest power from the very seat of Saint Peter, hoping to reduce the Church to a mere arm of the state. But I am not merely a bishop in a palace — I am the Vicar of Christ, charged with shepherding His flock. The power to guide Christendom rests in my hands, and I shall not yield it."

 tct_investiture_struggle.0051.desc.involved: "\nWith the Emperor’s authority challenged by the Pope’s spiritual claims, the world stands divided. Those who can master both realms will emerge as the true power brokers in this conflict."

 tct_investiture_struggle.0051.desc.interloper: "\nThis struggle between Emperor and Pope leaves no room for complacency. Those who act with resolve will find opportunities where others see only chaos."

 tct_investiture_struggle.0051.desc.papal_supporter: "\nThe Pope’s voice is the voice of God on Earth, and it is our sacred duty to defend it against those who would diminish its authority. In this struggle, we do not merely support a man; we uphold the divine will. The Emperor seeks to usurp what is holy, but we shall ensure that the spiritual guide the temporal."

 tct_investiture_struggle.0051.desc.imperial_supporter: "\nThe Empire teeters on the brink, and now more than ever, the Emperor needs steadfast allies. We are called to stand firm, to be the bulwark against chaos, and to ensure that the throne remains the ultimate seat of power. The Church may wield influence, but it is the Emperor who must lead."

 tct_investiture_struggle.0051.desc.unrest: "$tct_investiture_struggle.0051.desc$"

 tct_investiture_struggle.0051.desc.stabilization: "After a period of crisis, the Empire is recovering, the blood-soaked struggle slowly abating in Europe."

 tct_investiture_struggle.0051.desc.stabilization_actor: "Tensions ripple through the land, and the air is thick with uncertainty. Stability seems a distant memory, yet in the midst of this turmoil, opportunities are quietly emerging, shaping towards a new reality."

 tct_investiture_struggle.0051.a: "May [ROOT.Char.GetFaith.HighGodName] be with me!"
 tct_investiture_struggle.0051.b: "These foolish ambitions must be put to rest!"


