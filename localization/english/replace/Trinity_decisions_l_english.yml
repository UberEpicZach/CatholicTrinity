l_english:
 manage_papal_affairs: "Manage Papal Affairs"
 manage_papal_affairs_desc: "As the Pope, you have the unique ability to grant requests from your courtiers. These requests can range from seeking a divorce, asking for financial aid, or even requesting the excommunication of a rival. Use this power wisely to maintain your influence and control over the Church and its followers."
 manage_papal_affairs_divorce: "Divorce Requests"
 manage_papal_affairs_divorce_desc: "Choose how to handle divorce requests from your subjects. You can automatically approve all requests, deny them outright, or set specific criteria based on the petitioner's rank or circumstances."
 manage_papal_affairs_gold: "Requests for Gold"
 manage_papal_affairs_gold_desc: "Decide how to respond to requests for financial assistance. You can approve requests based on the petitioner's gold reserves, deny them if they exceed a certain amount, or set rank-based criteria for approval."
 manage_papal_affairs_excommunication: "Excommunication Requests"
 manage_papal_affairs_excommunication_desc: "Manage requests for excommunication. You can set rules based on the petitioner's piety, the target's rank, or whether the target is an ally of the Papacy. Use this power to enforce Church doctrine and discipline."
 
