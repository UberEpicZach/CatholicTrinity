l_english:

  tct_papal_demands.1.t: "The Demands of a Pope"
  tct_papal_demands.1.desc.intro: "A papal envoy arrives in your court, bearing a sealed bull from Rome. The Pope has considered your petition, but he will not grant it freely. His words, written in firm Latin hand, spell out the price of his favor:\n\n"

	tct_papal_demands.1.desc.gold_payment: ""You are commanded to provide a tribute of gold to the Apostolic See. Let it flow to the Church’s coffers, that the works of God may be maintained, the clergy sustained, and the poor and pilgrims cared for. The wealth of the faithful must reflect the devotion owed to Saint Peter’s See.""

  tct_papal_demands.1.desc.prestige_sacrifice: ""You shall make a public concession that diminishes your standing before men. Let it be known throughout Christendom that papal authority surpasses worldly renown, and that no crown, however high, may stand above the spiritual guidance of Rome.""

  tct_papal_demands.1.desc.artifact_transfer: ""You are to surrender a relic or treasure of note to the Church. It shall be safeguarded in Rome, preserved among the sacred vessels and relics that testify to the glory of God, and displayed so that all may know the devotion of your house.""

  tct_papal_demands.1.desc.vow_of_celibacy: ""You shall swear a vow of celibacy, forsaking worldly pleasures to prove that your devotion lies with God alone. Let this act of piety be a visible mark of obedience to the Holy See, and a lesson to your vassals and peers.""

  tct_papal_demands.1.desc.switch_to_papal_investiture: ""You shall abandon lay investiture, returning the authority of appointing bishops and abbots to the rightful guidance of the Papacy. No temporal power may encroach upon the sacred offices of the Church.""

  tct_papal_demands.1.desc.give_land_to_holy_order: ""You are commanded to grant lands to a Holy Order, offering shelter and support to the warriors of Christ. Let their banners rise on fields you provide, that they may defend the faithful and extend the reach of the Church.""

  tct_papal_demands.1.desc.donation_of_constantine: ""By the ancient Donation of Constantine, you shall cede to the Papacy the lands rightfully owed to Saint Peter’s See. Their possession by secular hands must end, so that the Church’s dominion may be honored.""

  tct_papal_demands.1.desc.return_italian_lands: ""You are to restore to the Papacy those Italian lands that fall under its rightful care. Let no prince or duke impede the See of Peter, for these holdings are sacred and must answer only to God and His vicar on Earth.""

  tct_papal_demands.1.desc.recognition_of_papal_independence: ""You shall recognize the Papal States as free and independent, bound to no mortal lord but God alone. Their autonomy is a shield for the Church, a visible sign of the sanctity of Rome.""

  tct_papal_demands.1.desc.succession_downgrade: ""You must amend your laws of succession, restraining the reach of your dynasty. Let it be known that crowns are granted by God, tempered by the blessing of the Church, and not to be multiplied in prideful disregard of His will.""

  tct_papal_demands.1.desc.abdication: ""You are to lay aside your crown and yield the governance of your realm to another. It is better to step down than to rule against the guidance of God and His Church, lest your house suffer eternal disfavor.""

  tct_papal_demands.1.desc.depose_excommunicated_ruler: ""You shall act against those excommunicated by the Church, removing from their thrones those whom God and His vicar have rejected. Let the faithful see that the judgment of Rome is carried out without delay.""

  tct_papal_demands.1.desc.depose_antipope: ""You shall strike against the Antipope, ensuring that no pretender challenges the authority of Saint Peter’s true successor. The unity of the Church must be defended, and her office upheld against all who sow division.""

  tct_papal_demands.1.desc.crusade_or_religious_war_support: ""You shall pledge your strength in a holy campaign, raising your arms against the enemies of the faith. Answer the call of the Pontiff, that the Church may triumph and the faithful be protected from those who defy God.""

  tct_papal_demands.1.desc.invade_italian_lands_on_popes_behalf: ""You are to march against the lords of Italy, reclaiming the lands that rightfully belong to the Papacy. Let your banners be a sign of obedience to Rome and a warning that her authority will be enforced.""

  tct_papal_demands.1.desc.go_on_pilgrimage: ""You shall undertake a pilgrimage, humbling yourself before God and His saints. Let your journey serve as both penance and example, inspiring the faithful through your visible devotion.""

  tct_papal_demands.1.desc.public_penanc: ""You are commanded to perform a public penance, displaying your repentance openly before your subjects and peers. Let all see your sincerity, and know that the favor of the Holy See is not given lightly.""


  tct_papal_demands.1.desc.ending: "\n\nThe Pope’s demand is clear. To secure his favor, you must decide whether to submit, or to defy the will of Rome."

  coronation_papal_demands_tooltip: "The Pope will demand a concession in return for his support.\n\nIf you accept and fulfill his demand, $anoinment_request_accepted_tt$."

