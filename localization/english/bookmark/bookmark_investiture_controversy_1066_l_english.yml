l_english: 
 BOOKMARK_RELATION_SON_IN_LAW: "(Son-in-law)"
 bm_investiture: "The Investiture Controversy"
 bm_investiture_desc: "The year is 1066, and the Holy Roman Empire is soon to be in turmoil. Ildebrando di Soana, a charismatic reformer, is rapidly ascending through the Church’s ranks, driving a bold new vision for the Church’s role in the world. No longer shall the Papacy remain content with merely advising kings; the Church now seeks to define the very essence of its rule by confronting the unchecked practices of Simony, Clerical Celibacy, and the appointment of bishops and abbots - Investiture. \n\nEmperor Henry IV flagrantly disregards these reform talks, alienating his vassals and the Church. His actions deepen the rift between the German princes, particularly the Saxon lords, who are aware of the shifting balance and have positioned themselves to exploit the instability."

 bookmark_heinrich: "Heinrich IV"
 bookmark_heinrich_desc: "Heinrich IV, the Holy Roman Emperor, born in 1050, ascended to the throne at a young age. His early reign is marked by the regency of his mother, Agnes of Poitou, who struggled to maintain control over the empire. Now that he has come of age, Heinrich is determined to follow in the footsteps of his father, Heinrich III, and assert his authority over the German princes, erecting a strong central government and fortresses all across the empire to serve his rule. Heinrich will soon face the greatest challenge of his reign, a Papacy that seeks to redefine the relationship between Church and State."
 bookmark_heinrich_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"

 bookmark_alexander: "Pope Alexander II"
 bookmark_alexander_desc: "Born Anselmo da Baggio, Pope Alexander II was elected to the papacy in 1061. His reign has been marked by a series of reforms aimed at reducing corruption and increasing the independence of the Church, empowering those such as Matilda of Tuscany to act as Imperial Vicar for the Papacy. \n\nPapal reformers like Ildebrando di Soana have grown increasingly influential, becoming close advisors to the Pope, as well as inspiring the clergy of Rome. The Papacy is now poised to challenge the authority of not only Kings but the Holy Roman Emperor, Heinrich IV, and assert its independence from secular control."
 bookmark_alexander_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_ordulf: "Ordulf of Saxony"
 bookmark_ordulf_desc: "Ordulf of Saxony is the Duke of Saxony and the father of Magnus Billung. Tired of the Emperor’s encroachment on  Saxony’s autonomy, Ordulf has been working to secure the interests of the Saxon people. He has been quietly building alliances with other powerful German princes, such as Rudolf of Rheinfelden and Otto of Nordheim, and is now poised to challenge the Emperor’s authority and assert his own independence."
 bookmark_ordulf_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 
 bookmark_matilda: "Matilda of Tuscany"
 bookmark_matilda_desc: "Matilda of Tuscany is a powerful and influential figure in the Holy Roman Empire. The daughter of Boniface of Tuscany, she has inherited vast estates in Tuscany and Lombardy, and has been a close ally of the Papacy. She has been granted the title of Imperial Vicar for the Papacy, and has been tasked with defending the Church’s interests in Italy. Matilda is now poised to challenge the authority of the Emperor and assert the independence of the Church in Italy."
 bookmark_matilda_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"

 bookmark_welf: "Welf, Count of Ravensburg"
 bookmark_welf_desc: "Welf Welf, Count of Ravensburg, son of Azzo II of Lombard-Este, and son-in-law to Otto of Nordheim of Bavaria. With growing discontent among the German princes, Welf is stuck between loyalty to the Emperor in Germany, loyalties to his father-in-law, or his possible inheritances in Italy."
 bookmark_welf_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_azzo: "Azzo II of Lombardy"


 bookmark_otto: "Otto of Nordheim"
 bookmark_otto_desc: "Otto of Nordheim, Duke of Bavaria, is one of the most prominent nobles in the empire-and among the boldest opponents of Emperor Heinrich IV. Unlike the cautious Ordulf, Otto is willing to act. Once loyal, he now views Heinrich’s overreach as a threat to Saxon autonomy and is rallying other discontented princes to push back against imperial authority."
 bookmark_otto_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"